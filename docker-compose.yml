services:
  db:
    image: postgres:16-alpine
    container_name: restaurant-os-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: restaurant
      POSTGRES_PASSWORD: restaurant_dev_password
      POSTGRES_DB: restaurant_os
    ports:
      - "5432:5432"
    volumes:
      - restaurant_pgdata:/var/lib/postgresql/data

volumes:
  restaurant_pgdata:
